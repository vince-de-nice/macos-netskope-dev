name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: shellcheck
        run: shellcheck -S warning -x install.sh lib/*.sh test/run-tests.sh

      - name: Run test suite
        run: ./test/run-tests.sh
